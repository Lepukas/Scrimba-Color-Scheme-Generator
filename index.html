<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="header">
            <input type="color" id="color"/>
            <select id="scheme">
                <option value="">Select a color scheme</option>
                <option value="monochrome">Monochrome</option>
                <option value="monochrome-dark">Monochrome-dark</option>
                <option value="monochrome-light">Monochrome-light</option>
                <option value="analogic">Analogic</option>
                <option value="complement">Complement</option>
                <option value="analogic-complement">Analogic-complement</option>
                <option value="triad">Triad</option>
            </select>
            <button id="color-btn">Get color scheme</button>
        </div>
        <div id="color-container">
            <div id="color1"></div>
            <div id="color2"></div>
            <div id="color3"></div>
            <div id="color4"></div>
            <div id="color5"></div>
        </div>
        <div id="hex-container">
            <div id="hex1">#F55A5A</div>
            <div id="hex2">#2B283A</div>
            <div id="hex3">#FBF3AB</div>
            <div id="hex4">#AAD1B6</div>
            <div id="hex5">#A626D3</div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
